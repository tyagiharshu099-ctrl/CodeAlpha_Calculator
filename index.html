<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header">
    <h1>MY <span>CALCULATOR</span></h1>
  </div>

  <div class="calculator">
    <input type="text" id="display" class="display" readonly value="0">

    <div class="buttons">
      <button class="btn btn-gray" onclick="clearDisplay()">C</button>
      <button class="btn btn-gray" onclick="toggleSign()">+/-</button>
      <button class="btn btn-gray" onclick="appendValue('%')">%</button>
      <button class="btn btn-orange" onclick="appendValue('/')">÷</button>

      <button class="btn btn-dark" onclick="appendValue('7')">7</button>
      <button class="btn btn-dark" onclick="appendValue('8')">8</button>
      <button class="btn btn-dark" onclick="appendValue('9')">9</button>
      <button class="btn btn-orange" onclick="appendValue('*')">×</button>

      <button class="btn btn-dark" onclick="appendValue('4')">4</button>
      <button class="btn btn-dark" onclick="appendValue('5')">5</button>
      <button class="btn btn-dark" onclick="appendValue('6')">6</button>
      <button class="btn btn-orange" onclick="appendValue('-')">−</button>

      <button class="btn btn-dark" onclick="appendValue('1')">1</button>
      <button class="btn btn-dark" onclick="appendValue('2')">2</button>
      <button class="btn btn-dark" onclick="appendValue('3')">3</button>
      <button class="btn btn-orange" onclick="appendValue('+')">+</button>

      <button class="btn btn-dark btn-zero" onclick="appendValue('0')">0</button>
      <button class="btn btn-dark" onclick="appendValue('.')">.</button>
      <button class="btn btn-orange" onclick="calculateResult()">=</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
